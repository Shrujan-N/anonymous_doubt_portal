server.port=8080

# Import local credentials override when present (gitignored)
spring.config.import=optional:classpath:application-local.properties

# MySQL Data Source Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/doubt_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep Hibernate from altering ENUM columns or rewriting DDL constraints
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (fast 1.5s server selection timeout for responsive fallback if mongod is stopped)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/doubt_portal_nosql?serverSelectionTimeoutMS=1500&connectTimeoutMS=1500}
