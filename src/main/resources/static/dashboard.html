<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Classroom Doubt Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/dashboard.html">
                <i class="bi bi-mortarboard-fill text-primary"></i> Classroom Doubt Portal
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span id="userInfo" class="badge bg-secondary px-3 py-2">Checking session...</span>
                <select id="quickSwitch" class="form-select form-select-sm" style="width: auto;" onchange="quickSwitchAccount(this.value)">
                    <option value="">Quick Switch...</option>
                    <option value="STUDENT|rahul@pes.edu|hashed_pwd_1">Student: Rahul Sharma</option>
                    <option value="STUDENT|ananya@pes.edu|hashed_pwd_2">Student: Ananya Rao</option>
                    <option value="STUDENT|vikram@pes.edu|hashed_pwd_3">Student: Vikram Verma</option>
                    <option value="TEACHER|sudhir@pes.edu|prof_pwd_1">Teacher: Dr. Sudhir Kumar</option>
                    <option value="ADMIN|admin@pes.edu|admin_root_pwd">Admin: System Admin</option>
                </select>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="roleAlert" class="alert alert-primary shadow-sm d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-info-circle-fill"></i>
            <span id="roleAlertText">Loading profile...</span>
        </div>
        <div id="successAlert" class="alert alert-success shadow-sm d-none d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span id="successAlertText"></span>
        </div>
        <div id="errorAlert" class="alert alert-danger shadow-sm d-none d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorAlertText"></span>
        </div>

        <div class="row g-4">
            <!-- Left Column -->
            <div class="col-lg-5">
                <!-- Ask a Doubt Card (Student Only) -->
                <div id="postDoubtCard" class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white fw-semibold d-flex align-items-center gap-2 py-3">
                        <i class="bi bi-pencil-square"></i> Ask a Question
                    </div>
                    <div class="card-body p-4">
                        <form id="doubtForm">
                            <div class="mb-3">
                                <label class="form-label fw-medium" for="title">Title</label>
                                <input type="text" id="title" class="form-control" placeholder="e.g., What is 3NF Normalization?" required>
                            </div>
                            <div class="row">
                                <div class="col-md-7 mb-3">
                                    <label class="form-label fw-medium" for="subjectId">Subject</label>
                                    <select id="subjectId" class="form-select"></select>
                                </div>
                                <div class="col-md-5 mb-3">
                                    <label class="form-label fw-medium" for="priority">Priority</label>
                                    <select id="priority" class="form-select">
                                        <option value="High">High</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="Low">Low</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium" for="tagsInput">Topic Tags (comma-separated)</label>
                                <input type="text" id="tagsInput" class="form-control" placeholder="e.g., SQL, Normalization, ExamPrep">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium" for="description">Detailed Description</label>
                                <textarea id="description" class="form-control" rows="3" placeholder="Describe where you are getting stuck..." required></textarea>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="isAnonymous">
                                <label class="form-check-label" for="isAnonymous">
                                    <i class="bi bi-incognito"></i> Post Anonymously (Hide my identity)
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                                <i class="bi bi-send-fill me-1"></i> Post Question
                            </button>
                        </form>
                    </div>
                </div>

                <!-- MongoDB Vector Search Card -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-semibold d-flex align-items-center justify-content-between py-3">
                        <span class="d-flex align-items-center gap-2 text-dark">
                            <i class="bi bi-diagram-3-fill text-success"></i> Vector Search
                        </span>
                        <span class="badge bg-success-subtle text-success border border-success-subtle">MongoDB NoSQL</span>
                    </div>
                    <div class="card-body p-3">
                        <div class="input-group mb-2">
                            <input type="text" id="vectorQueryInput" class="form-control form-control-sm" placeholder="e.g., B+ tree disk storage...">
                            <button class="btn btn-sm btn-success" type="button" onclick="searchVectorsSemantic()">
                                Similar
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" type="button" onclick="searchVectorsByTag()">
                                Tag
                            </button>
                        </div>

                        <div id="vectorSearchResults" class="small text-muted">
                            Loading vector index...
                        </div>
                    </div>
                </div>

                <!-- Leaderboard Card -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center py-3">
                        <span class="d-flex align-items-center gap-2 text-dark">
                            <i class="bi bi-trophy-fill text-warning"></i> Contributor Leaderboard
                        </span>
                        <button class="btn btn-sm btn-light border" onclick="loadLeaderboard()">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div id="leaderboardContainer" class="list-group list-group-flush small">
                            <div class="p-3 text-muted text-center">Loading leaderboard...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                            <h5 class="mb-0 fw-semibold text-dark d-flex align-items-center gap-2">
                                <i class="bi bi-chat-left-text-fill text-primary"></i> Classroom Discussion Thread
                            </h5>
                            <button class="btn btn-sm btn-outline-secondary" onclick="loadAllDoubts()">
                                <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                            </button>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-5">
                                <input type="text" id="fullTextInput" class="form-control form-control-sm" placeholder="Search doubts by keyword...">
                            </div>
                            <div class="col-md-3">
                                <select id="filterSubject" class="form-select form-select-sm" onchange="loadAllDoubts()">
                                    <option value="">All Subjects</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select id="filterStatus" class="form-select form-select-sm" onchange="loadAllDoubts()">
                                    <option value="">All Status</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Answered by Student">Peer Answered</option>
                                    <option value="Answered by Teacher">Faculty Answered</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-sm btn-primary w-100" onclick="loadAllDoubts()">Search</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div id="doubtsContainer" class="accordion">
                            <div class="text-center text-muted py-4">Loading discussions...</div>
                        </div>
                    </div>
                </div>

                <!-- Admin Moderation Archive Card -->
                <div id="adminAuditCard" class="card shadow-sm d-none">
                    <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center py-3">
                        <span class="text-danger d-flex align-items-center gap-2">
                            <i class="bi bi-shield-exclamation"></i> Moderation Archive
                        </span>
                        <button class="btn btn-sm btn-outline-danger" onclick="loadAuditLog()">Refresh</button>
                    </div>
                    <div class="card-body p-3" id="auditContainer">
                        <div class="text-muted small">Loading archived items...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
