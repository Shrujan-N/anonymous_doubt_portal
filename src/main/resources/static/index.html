<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Classroom Doubt Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">DoubtPortal</a>
            <span class="navbar-text text-white">DBMS Level 3 Project</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white font-weight-bold">Ask a Question</div>
                    <div class="card-body">
                        <form id="doubtForm">
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Subject ID</label>
                                <input type="number" id="subjectId" class="form-control" value="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea id="description" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="isAnonymous">
                                <label class="form-check-label">Post Anonymously</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Doubt</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Active Doubts Thread</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="fetchDoubts()">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div id="doubtsList" class="list-group">
                            <div class="text-center text-muted">Loading doubts...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/doubts';

        async function fetchDoubts() {
            const res = await fetch(API_URL);
            const doubts = await res.json();
            const list = document.getElementById('doubtsList');
            list.innerHTML = '';
            
            doubts.forEach(d => {
                list.innerHTML += `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">${d.title}</h6>
                            <span class="badge bg-${d.status === 'Pending' ? 'warning' : 'success'}">${d.status}</span>
                        </div>
                        <p class="mb-1 text-secondary">${d.description || ''}</p>
                        <small class="text-muted">Posted ${d.isAnonymous ? 'Anonymously' : 'by Student ID ' + d.studentId}</small>
                    </div>
                `;
            });
        }

        document.getElementById('doubtForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                studentId: 1,
                subjectId: document.getElementById('subjectId').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                isAnonymous: document.getElementById('isAnonymous').checked,
                priority: 'Medium'
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('doubtForm').reset();
            fetchDoubts();
        });

        fetchDoubts();
    </script>
</body>
</html>
